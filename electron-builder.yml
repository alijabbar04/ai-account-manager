appId: io.github.ai-account-manager
productName: AI Account Manager
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  # unpacked (not in the asar) so Adobe Acrobat can open it directly
  - from: docs/USAGE_TRACKING_GUIDE.pdf
    to: USAGE_TRACKING_GUIDE.pdf
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: AIAccountManager-Setup-${version}.${ext}
electronLanguages:
  - en-US
