name: Bug report
description: Something in the app does not work as documented.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials.** No API key, OAuth token, cookie, session
        value or `Authorization` header belongs in a public issue. If a log line
        contains one, replace it with `<redacted>`. If you have already posted
        one, rotate that key with the provider immediately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened API Keys
        2. Added an Anthropic key
        3. Expected it to save; got "Stored key could not be decrypted"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Dashboard -> Updates, or the version in Add/Remove Programs.
      placeholder: "1.7.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer from the Releases page
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "`winver`, e.g. Windows 11 24H2."
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Which part of the app?
      description: |
        Accounts, GPT/Codex usage, API keys and analytics, alerts, updates,
        Automation & Sessions, or the session launcher.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Redacted only. Automation diagnostics are already redacted when exported
        from **Automation & Sessions -> Activity**.
      render: text
    validations:
      required: false
