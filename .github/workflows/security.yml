name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, so a newly published advisory surfaces without a code change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0
      - name: Scan the working tree and full history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for GitHub Organization accounts.
          # A personal repository scans without it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Everything here is a build-time dependency - the shipped app has only
      # react and react-dom - so a finding is a toolchain upgrade, not a live
      # exploit path. It is reported rather than enforced so an advisory
      # published mid-review cannot block an unrelated pull request.
      - name: Report known advisories
        run: npm audit --audit-level=high || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
          - language: csharp
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 'languages' is plural and it matters: with the singular spelling the
      # input is ignored, CodeQL auto-detects every language in the repository,
      # and each job then fails trying to finalize a database for a language it
      # was never asked to build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      # A manual build mode means the build has to happen here, between init
      # and analyze. The JavaScript runtime is not compiled and needs none.
      - if: matrix.language == 'csharp'
        run: dotnet build automation/src/AIAccountManager.Automation/AIAccountManager.Automation.csproj --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
