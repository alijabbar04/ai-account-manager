name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    # The app is Windows-only: it drives Windows UI Automation, DPAPI and the
    # per-user registry. There is nothing meaningful to run on another OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 'npm ci' installs exactly what package-lock.json pins and fails if the
      # lockfile has drifted from package.json.
      - name: Install JavaScript dependencies
        shell: powershell
        run: |
          $cache = npm.cmd config get cache
          "NPM_LOG_DIRECTORY=$cache/_logs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\setup.ps1 -SkipTests

      - name: Verify formatting
        run: npm run format:check

      - name: Test and build Windows installer and unpacked application
        shell: powershell
        run: .\build\build.ps1

      - name: Generate and validate release artifacts
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          npm.cmd run release:manifest -- "release/AI-Account-Manager-Setup-$version.exe" "https://github.com/alijabbar04/ai-account-manager/releases/download/v$version/AI-Account-Manager-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run verify:release -- --artifacts --official

      - name: Upload reviewable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ai-account-manager-windows-unpacked
          path: release/win-unpacked/
          if-no-files-found: error

      - name: Upload reviewable installer, manifest and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ai-account-manager-installer-${{ env.PACKAGE_VERSION }}
          if-no-files-found: error
          path: |
            release/AI-Account-Manager-Setup-${{ env.PACKAGE_VERSION }}.exe
            release/latest.json
            release/SHA256SUMS.txt
            release/install.ps1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ env.NPM_LOG_DIRECTORY }}
            release/builder-debug.yml
