name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    # The app is Windows-only: it drives Windows UI Automation, DPAPI and the
    # per-user registry. There is nothing meaningful to run on another OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 'npm ci' installs exactly what package-lock.json pins and fails if the
      # lockfile has drifted from package.json.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Run JavaScript, runtime and native helper tests
        run: npm test

      - name: Build unpacked Windows application
        run: npm run build:dir

      - name: Upload reviewable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ai-account-manager-windows-unpacked
          path: release/win-unpacked/
          if-no-files-found: error
