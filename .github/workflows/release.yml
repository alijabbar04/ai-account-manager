name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Needed to create the GitHub Release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the update manifest reads the annotated tag's
          # message, which a shallow checkout would not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A tag that disagrees with package.json would publish an installer whose
      # in-app version does not match the release it came from.
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          $cache = npm.cmd config get cache
          "NPM_LOG_DIRECTORY=$cache/_logs" >> $env:GITHUB_ENV
          $tag = "v$version"
          if ($env:GITHUB_REF -like "refs/tags/*") { $tag = $env:GITHUB_REF -replace "^refs/tags/", "" }
          node scripts/verify-release.cjs --tag $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Preparing version $version (public publication requires approval)"

      - name: Clean install and validate developer setup under Windows PowerShell 5.1
        shell: powershell
        run: .\setup.ps1 -SkipTests

      - run: npm run format:check

      # Signing is optional. electron-builder signs when CSC_LINK is present and
      # produces an unsigned installer when it is not; no certificate or
      # password is ever stored in this repository. To sign, add repository
      # secrets WINDOWS_CERTIFICATE_BASE64 (base64 of a .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD. See SECURITY.md.
      - name: Build installer
        shell: powershell
        run: .\build\build.ps1
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # The manifest's download URL must be HTTPS, so point it at the release
      # asset this workflow is about to upload. The in-app updater then verifies
      # the installer against this SHA-256 before offering it.
      - name: Generate the update manifest
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $installer = "release/AI-Account-Manager-Setup-$version.exe"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
              $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
              "v$version"
          }
          # These notes are shown to users in Dashboard -> Updates, so prefer the
          # annotated tag's message - written for them - over the raw commit
          # body, which is written for whoever reads the history.
          $notes = ""
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $notes = (git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' $tag | Out-String).Trim()
          }
          if (-not $notes) { $notes = "See the release notes for details." }
          $env:RELEASE_NOTES = $notes
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/AI-Account-Manager-Setup-$version.exe"
          npm run release:manifest -- $installer $url

      - name: Verify exact installer, manifest and SHA-256 artifacts
        run: npm run verify:release -- --tag "v${{ env.PACKAGE_VERSION }}" --artifacts --official

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-account-manager-windows-${{ env.PACKAGE_VERSION }}
          if-no-files-found: error
          path: |
            release/AI-Account-Manager-Setup-${{ env.PACKAGE_VERSION }}.exe
            release/latest.json
            release/SHA256SUMS.txt
            release/install.ps1

      - name: Refuse to modify an already published release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          try {
              $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$env:PACKAGE_VERSION" -Headers $headers
              if (-not $existing.draft) { throw 'This version is already public. Prepare a new version instead of overwriting published assets.' }
          } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

      - name: Prepare draft GitHub Release for explicit publication approval
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AI Account Manager ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/AI-Account-Manager-Setup-${{ env.PACKAGE_VERSION }}.exe
            release/latest.json
            release/SHA256SUMS.txt
            release/install.ps1

      - name: Explain approval and release status
        shell: pwsh
        run: |
          "Prepared $env:PACKAGE_VERSION. Tests, installer, embedded version, manifest and SHA-256 checks passed." >> $env:GITHUB_STEP_SUMMARY
          "A tag prepares a draft release only. Review and smoke-test the downloaded artifacts, then explicitly publish the draft in GitHub Releases. workflow_dispatch builds artifacts without creating a release or tag." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-failure-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ env.NPM_LOG_DIRECTORY }}
            release/builder-debug.yml
