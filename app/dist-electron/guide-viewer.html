<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self' file:; object-src 'self'"
    />
    <title>API Usage Tracking Guide</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: #0d0f12;
      }
      body {
        display: flex;
        flex-direction: column;
        font:
          13px "Segoe UI",
          sans-serif;
      }
      header {
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        flex: 0 0 auto;
      }
      header .title {
        font-size: 14px;
        font-weight: 700;
      }
      header .sub {
        color: #8a8f98;
        font-size: 11px;
        flex: 1 1 auto;
      }
      button {
        appearance: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: #0d0f12;
        background: #3ddc97;
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: #34c98a;
      }
      button:disabled {
        background: #1d232b;
        color: #9aa4b0;
        cursor: default;
      }
      #status {
        color: #9aa4b0;
        font-size: 11px;
        min-width: 90px;
        text-align: right;
      }
      iframe {
        flex: 1 1 auto;
        border: 0;
        width: 100%;
        background: #16181d;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">📖 API Usage Tracking Guide</span>
      <span class="sub"
        >why usage pages can be empty · locally-measured ledger · admin-key
        setup</span
      >
      <span id="status"></span>
      <button id="acro">Open in Adobe Acrobat</button>
    </header>
    <iframe id="pdfframe" title="Usage tracking guide PDF"></iframe>
    <script>
      const pdf = new URLSearchParams(location.search).get("pdf");
      if (pdf)
        document.getElementById("pdfframe").src = pdf + "#toolbar=1&view=FitH";
      const btn = document.getElementById("acro");
      const status = document.getElementById("status");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        status.textContent = "opening…";
        try {
          const r = await window.cam.openGuideInAcrobat();
          status.textContent = !r.ok
            ? "couldn't open"
            : r.how === "acrobat"
              ? "opened in Acrobat ✓"
              : "opened in default PDF app ✓";
        } catch {
          status.textContent = "couldn't open";
        }
        setTimeout(() => {
          btn.disabled = false;
          status.textContent = "";
        }, 3500);
      });
    </script>
  </body>
</html>
